---
id: "56"
title: "Pull an Image from a Private Registry Using ImagePullSecrets"
difficulty: "hard"
category: "Workloads"
order: 56
description: |
  The team needs to deploy an application from a private container registry.
  Create an ImagePullSecret and use it in a Deployment so the pods can pull the image.

  **Your tasks:**
  1. Create a secret named `myregistry-secret` of type `kubernetes.io/dockerconfigjson`
     using the registry `docker.io` with username `student` and password `securepassword123`.
  2. Create a Deployment `private-app` with 2 replicas using image `docker.io/library/nginx:1.25`.
  3. Bind the `myregistry-secret` to the Deployment using `imagePullSecrets`.

  ```
  kubectl get secret myregistry-secret
  kubectl get deployment private-app
  ```
hints:
  - "Use `kubectl create secret docker-registry myregistry-secret --docker-server=docker.io --docker-username=student --docker-password=securepassword123`"
  - "Add `imagePullSecrets` under the pod spec, not the Deployment spec."
  - "In Kubernetes 1.27+, `imagePullSecrets` must be an array: `imagePullSecrets: [{name: myregistry-secret}]`"
  - "Verify with: `kubectl get deployment private-app -o yaml | grep -A2 imagePullSecrets`"
  - "Check pod events for pull errors: `kubectl describe pod <name>`"
  - "Note: In a real scenario, the registry must be accessible. This exercise tests the secret setup only."
validation:
  - args: ["get", "secret", "myregistry-secret", "-o", "jsonpath={.type}"]
    expect: "kubernetes.io/dockerconfigjson"
    description: "Secret is of type dockerconfigjson"
  - args: ["get", "secret", "myregistry-secret", "-o", "jsonpath={.data}"]
    expect: ""
    match: "nonempty"
    description: "Secret contains docker config data"
  - args: ["get", "deployment", "private-app", "-o", "jsonpath={.spec.replicas}"]
    expect: "2"
    description: "Deployment has 2 replicas"
  - args: ["get", "deployment", "private-app", "-o", "jsonpath={.spec.template.spec.imagePullSecrets[0].name}"]
    expect: "myregistry-secret"
    description: "Pod spec references imagePullSecret myregistry-secret"
  - args: ["get", "deployment", "private-app", "-o", "jsonpath={.spec.template.spec.containers[0].image}"]
    expect: "docker.io/library/nginx:1.25"
    description: "Pod uses the correct private registry image"
preconditions: []