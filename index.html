      <div class="track"><div id="bar"></div></div>
      <div class="row timer"><span>⏱ <b id="clock"></b></span><span><button id="play"></button><button id="reset-time" title="Reset timer">↺</button></span></div>

    </header>
    <nav id="exercises" aria-label="Exercises"></nav>
    <footer><i class="light"></i>Cluster ready</footer>

    <section id="detail">

        <div id="reading"><article id="description"></article><button id="hint-toggle"></button><ul id="hints" hidden></ul><div id="result" hidden></div></div>
        <div class="actions"><button id="check">✓ Check Answer</button><button id="reset-lab">↺ Reset Environment</button></div>
      </div>
    </section>
    <div id="divider" role="separator" aria-label="Resize terminal"><i></i><i></i><i></i></div>
    <section id="terminal">
      <header class="toolbar"><div class="window-controls"><button data-mode="desc-max" title="Collapse terminal">✕</button><button data-mode="split" title="Restore split">↕</button><button data-mode="term-max" title="Maximise terminal">⤢</button></div><span class="shell-name">bash — cka-lab</span><span class="connected"><i class="light"></i>Connected</span><button id="reconnect" title="Reconnect terminal">↺</button></header>
      <div id="console" class="xterm-container"></div>
    </section>
  </main>
